<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>builtin-browser 样式 Playground</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./playground.js"></script>
  <script>
    // Auto-reload: dev.mjs pushes an SSE event after every rebuild.
    const es = new EventSource('/__playground_events')
    es.onmessage = (e) => { if (e.data === 'reload') location.reload() }
  </script>
</body>
</html>
