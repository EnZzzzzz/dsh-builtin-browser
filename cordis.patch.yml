# dsh-builtin-browser bundle layer: one insert that mounts the built-in browser
# plugin. Applied after every profile bundle layer; users override rows by id in
# their profile cordis.patch.yml.
#
# The plugin registers the `browser_*` agent tools on the Host and, in the Web
# client, contributes a tab TYPE to the official right Sidebar
# (`ctx.sidebarRightTabs` + the `sidebar.right.pane.tab` seat). Its entry point
# is therefore the production sidebar UI itself: the "Built-in browser" capsule
# on the sidebar's guide page, the `browser.new` shortcut, or
# `ctx.sidebarRight.openTab('builtin-browser')`. Nothing here depends on the
# legacy `sidebar.footer.action` or `shell.overlay` seats.
#
# The browsing surface itself is a <webview> provided by the Desktop shell
# (Electron), so inside such a shell the tab renders a real Chromium guest. The
# shell must run the companion HTTP control endpoint (desktop/main.cjs) and set
# DSH_DESKTOP_BROWSER_PORT so the host half can reach it; outside a shell the
# tab degrades to an <iframe> and the agent tools report the endpoint as
# unavailable.
#
# The `browser_*` tools register globally, so every agent preset gets them
# EXCEPT the ones listed in `hideForPresets` (default: `minimal` — 极简模式 is a
# fixed two-tool composition). Override `hideForPresets` here to change which
# presets keep the browser tools; the mask is applied per agent at creation and
# follows blank-session preset switches.
- insert:
    - id: builtin-browser
      name: dsh-builtin-browser
      config:
        enabled: true
        hideForPresets: ['minimal']
